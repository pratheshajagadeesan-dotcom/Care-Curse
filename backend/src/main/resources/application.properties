spring.application.name=carepulse-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/carepulse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=SpeakWise@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Authentication
carepulse.jwt.secret=CarePulseAiSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256
carepulse.jwt.expiration-ms=86400000

# AI Configuration (Supports external LLM or local fallback)
carepulse.ai.api-key=${AI_API_KEY:}
carepulse.ai.model=${AI_MODEL:gemini-1.5-flash}

# OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.carepulse=INFO
logging.level.org.springframework.security=WARN